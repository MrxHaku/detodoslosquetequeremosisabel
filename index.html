<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>28 Primaveras - Bel</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Dancing+Script:wght@700&family=Bungee&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤍</text></svg>">
    <style>
        :root {
            --crema: #fdfcf0; --miel: #b08968;
            --v1: #E91E63; --v2: #FFEB3B; --v3: #2196F3; --v4: #4CAF50; --v5: #FF5722;
        }

        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; background-color: var(--crema); 
            font-family: 'Special Elite', serif; height: 100vh; overflow-x: hidden;
        }

        .grid-bg {
            background-color: var(--crema);
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* ── LOADER ── */
        #loader {
            position: fixed; inset: 0; background: var(--crema);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 1.2s ease, visibility 1.2s;
        }
        #loader.hidden { opacity: 0; visibility: hidden; }
        .loader-content { text-align: center; display: flex; flex-direction: column; gap: 20px; }
        .loader-heart { font-size: 3rem; animation: heartbeat 1.2s infinite; }
        .loader-text { font-family: 'Dancing Script'; font-size: 1.5rem; color: #b08968; }
        @keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }

        /* ── PANTALLA DE VIDEO INTRO ── */
        #video-intro-screen {
            position: fixed; inset: 0; z-index: 8000;
            background: #111;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 24px;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #video-intro-screen.visible { opacity: 1; }
        #video-intro-screen.fade-out { opacity: 0; pointer-events: none; }

        /* Marco de la línea gráfica */
        .video-frame-wrapper {
            position: relative;
            width: 90vw;
            max-width: 1100px;
        }
        .video-frame-inner {
            position: relative;
            border: 5px solid #fff;
            box-shadow:
                8px 8px 0 #333,
                0 0 0 10px #333,
                14px 14px 0 #333;
            background: #000;
        }
        /* Las 4 esquinas se ponen en el wrapper que abarca video+controles */
        .corner {
            position: absolute;
            width: 44px; height: 44px;
            z-index: 10; pointer-events: none;
        }
        .corner.top-left  { top: -12px; left: -12px; border-top: 5px solid var(--v1); border-left: 5px solid var(--v1); }
        .corner.top-right { top: -12px; right: -12px; border-top: 5px solid var(--v2); border-right: 5px solid var(--v2); }
        .corner.bot-left  { bottom: -12px; left: -12px; border-bottom: 5px solid var(--v3); border-left: 5px solid var(--v3); }
        .corner.bot-right { bottom: -12px; right: -12px; border-bottom: 5px solid var(--v4); border-right: 5px solid var(--v4); }

        #video-intro {
            width: 100%;
            display: block;
            max-height: 78vh;
            object-fit: contain;
        }

        /* Controles del video */
        .video-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #fff;
            border: 3px solid #333;
            box-shadow: 5px 5px 0 #333;
            padding: 10px 22px;
            border-radius: 0;
            width: 90vw;
            max-width: 1100px;
        }
        .vc-btn {
            background: none; border: none; cursor: pointer; padding: 4px;
            display: flex; align-items: center;
        }
        .vc-btn svg { fill: #333; }
        .vc-btn:hover svg { fill: var(--v1); }
        #video-progress {
            flex: 1; height: 6px; appearance: none; -webkit-appearance: none;
            background: #ddd; cursor: pointer; outline: none;
            accent-color: var(--v1);
        }
        #video-volume { width: 80px; accent-color: #333; cursor: pointer; }
        #video-time { font-size: 0.78rem; color: #666; white-space: nowrap; font-family: 'Special Elite', serif; }

        /* ── LANDING ── */
        #landing {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; flex-direction: column; justify-content: space-evenly; align-items: center;
            padding: 40px 20px; transition: opacity 1s;
        }
        #landing.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .char {
            display: inline-block; font-family: 'Bungee', cursive;
            font-size: clamp(1.4rem, 5vw, 3.5rem); 
            padding: 10px 15px; box-shadow: 4px 4px 0px rgba(0,0,0,0.15);
            transform: rotate(var(--r)); margin: 3px;
        }
        .v1{background:var(--v1);color:white} .v2{background:var(--v2);color:#333}
        .v3{background:var(--v3);color:white} .v4{background:var(--v4);color:white}
        .v5{background:var(--v5);color:white}

        .title-container { display:flex; flex-direction:column; align-items:center; gap:12px; z-index:10; }
        .line { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px; }

        .polaroid-landing {
            position: absolute; background: white; padding: 10px 10px 30px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); border: 1px solid #ddd;
            width: 210px; z-index: 2;
            animation: swayPolaroid var(--sway-dur, 5s) ease-in-out infinite alternate;
            transform-origin: top center;
        }
        .polaroid-landing:hover { animation-play-state:paused; transform:scale(1.1) rotate(0deg) !important; z-index:50; }
        @keyframes swayPolaroid {
            0%   { transform: rotate(var(--r)) translateY(0px); }
            50%  { transform: rotate(calc(var(--r) + 3deg)) translateY(-8px); }
            100% { transform: rotate(calc(var(--r) - 3deg)) translateY(-4px); }
        }
        .polaroid-landing img { width:100%; aspect-ratio:1/1; object-fit:cover; }

        .floating-emoji { 
            position:absolute; font-size:3.5rem; z-index:5; 
            animation: floatEmoji 5s ease-in-out infinite alternate;
        }
        @keyframes floatEmoji {
            from { transform: translate(0,0) rotate(-10deg); }
            to   { transform: translate(15px,-20px) rotate(10deg); }
        }

        /* ── REPRODUCTOR ── */
        .tracklist-dropdown {
            position: absolute; bottom: 70px; left: 0;
            background: #fff; border: 3px solid #333; box-shadow: 5px 5px 0 #333;
            min-width: 220px; z-index: 3000; display: none; flex-direction: column;
        }
        .tracklist-dropdown.open { display: flex; }
        .track-item {
            padding: 10px 16px; cursor: pointer; font-size: 0.85rem;
            font-family: 'Special Elite', serif; border-bottom: 1px solid #eee;
            transition: background 0.15s; white-space: nowrap;
        }
        .track-item:last-child { border-bottom: none; }
        .track-item:hover { background: var(--crema); }
        .track-item.active { background: #333; color: #fff; }
        .vinyl-wrapper { position: relative; cursor: pointer; }
        .vinyl-disk {
            width:55px; height:55px; border-radius:50%; border:2px solid #000;
            background: radial-gradient(circle at 50% 50%,#fff 0%,#fff 11%,transparent 12%),
                repeating-radial-gradient(circle at 50% 50%,#111 0px,#111 2px,#222 2px,#222 4px,#111 4px,#111 6px,#333 6px,#333 8px);
            position:relative; animation:spin 2.5s linear infinite; animation-play-state:paused;
            box-shadow:0 0 0 2px #333,inset 0 0 8px rgba(0,0,0,0.5);
        }
        .vinyl-disk::after {
            content:''; position:absolute; top:50%; left:50%;
            width:12px; height:12px; background:#fff; border-radius:50%;
            transform:translate(-50%,-50%); border:2px solid #000; z-index:2;
        }
        .vinyl-disk::before {
            content:''; position:absolute; top:50%; left:50%;
            width:30px; height:30px; border-radius:50%;
            background:transparent; border:1px solid rgba(255,255,255,0.1);
            transform:translate(-50%,-50%);
        }
        @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

        /* ── SOBRE ── */
        .envelope { 
            width:150px; height:105px; background:#f3d5b5; position:relative; 
            cursor:pointer; transition:transform 0.3s ease; perspective:800px; overflow:visible;
        }
        .envelope:hover { transform:scale(1.1) rotate(2deg); }
        .envelope .carta-interior {
            position:absolute; bottom:0; left:10%; width:80%; height:55px;
            background:#fff; border:1px solid #e0e0e0; border-radius:2px 2px 0 0;
            z-index:1; transform:translateY(0px);
            transition:transform 0.5s ease 0.2s, opacity 0.4s ease 0.2s; opacity:0;
            background-image:repeating-linear-gradient(transparent,transparent 10px,#e8e8e8 10px,#e8e8e8 11px);
            background-position:0 12px;
        }
        .envelope:hover .carta-interior { transform:translateY(-28px); opacity:1; }
        .envelope::after {
            content:''; position:absolute; top:0; left:0; z-index:3;
            border-top:55px solid #e6ccb2; border-left:75px solid transparent; border-right:75px solid transparent;
            transform-origin:top; transition:transform 0.45s ease;
        }
        .envelope:hover::after { transform:rotateX(160deg); }
        .env-body { position:absolute; inset:0; z-index:2; background:#f3d5b5; display:flex; justify-content:center; align-items:center; }
        .env-number { font-family:'Bungee'; color:#7f5539; font-size:1.5rem; }
        .envelope.pendiente .env-body { background:repeating-linear-gradient(45deg,#f3d5b5,#f3d5b5 5px,#edd5aa 5px,#edd5aa 10px); }
        .envelope.pendiente .env-number { opacity:0.5; }

        /* ── MODAL CARTA ── */
        .modal-container { 
            display:flex; flex-wrap:nowrap; background:var(--crema); 
            width:95vw; max-width:1100px; height:600px; 
            margin:40px auto; border:3px solid #333; overflow:hidden; 
        }
        .text-side { flex:1; padding:40px; border-right:2px dashed #ccc; display:flex; flex-direction:column; }
        .scroll-area {
            flex-grow:1; overflow-y:auto; padding:20px 10px;
            mask-image:linear-gradient(to bottom,transparent,black 15%,black 85%,transparent);
            -webkit-mask-image:linear-gradient(to bottom,transparent,black 15%,black 85%,transparent);
        }

        /* ── FLORES ── */
        .flower-bg {
            position:fixed; font-size:2rem; pointer-events:none; z-index:0;
            animation:floatFlower 10s ease-in-out infinite alternate; opacity:0.35;
        }
        @keyframes floatFlower {
            0%  {transform:translate(0,0) rotate(-8deg) scale(1)}
            25% {transform:translate(8px,-12px) rotate(4deg) scale(1.05)}
            50% {transform:translate(-6px,-20px) rotate(-4deg) scale(0.97)}
            75% {transform:translate(12px,-8px) rotate(8deg) scale(1.03)}
            100%{transform:translate(-10px,-25px) rotate(-6deg) scale(1)}
        }

        /* ── MISC UI ── */
        .music-player { 
            position:fixed; bottom:20px; left:20px; display:flex; align-items:center; 
            gap:12px; background:#fff; padding:10px 18px; border-radius:50px; 
            border:3px solid #333; box-shadow:6px 6px 0px #333; z-index:2000; 
        }
        .player-controls { display:flex; align-items:center; gap:6px; }
        .player-btn { background:none; border:none; cursor:pointer; padding:4px; display:flex; align-items:center; }
        .player-btn svg { fill:#333; }
        .player-btn:hover svg { fill:var(--v1); }

        #main-content { display:none; padding:130px 20px 80px; flex-direction:column; align-items:center; position:relative; }
        .envelopes-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:40px; max-width:1200px; position:relative; z-index:1; }
        .custom-btn { padding:15px 35px; cursor:pointer; font-family:'Bungee'; border:3px solid #333; background:#fff; box-shadow:5px 5px 0px #333; transition:0.2s; }
        .custom-btn:hover { transform:translate(-2px,-2px); box-shadow:7px 7px 0px #333; }
        .header-nav { position:fixed; top:0; width:100%; height:90px; background:linear-gradient(var(--crema) 75%,transparent); display:flex; justify-content:center; align-items:center; z-index:500; }
        .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; z-index:3000; padding:20px; justify-content:center; align-items:center; }
        .photo-side { width:480px; padding:30px 24px; background:#fff; display:flex; flex-direction:column; align-items:center; gap:30px; overflow-y:auto; }
        #flower-container { position:fixed; inset:0; pointer-events:none; z-index:0; }

        /* ── POPUP FELIZ CUMPLEAÑOS ── */
        #popup-feliz {
            position: fixed; inset: 0; z-index: 9000;
            background: rgba(0,0,0,0.75);
            display: none; justify-content: center; align-items: center;
            animation: fadeInPopup 0.6s ease;
        }
        @keyframes fadeInPopup { from{opacity:0} to{opacity:1} }
        .popup-card {
            background: var(--crema);
            border: 4px solid #333;
            box-shadow: 10px 10px 0 #333;
            padding: 60px 50px;
            text-align: center;
            max-width: 600px;
            width: 90vw;
            position: relative;
        }
        .popup-card::before {
            content: ''; position: absolute; inset: 8px;
            border: 2px dashed rgba(0,0,0,0.12);
            pointer-events: none;
        }
        .popup-emojis { font-size: 2.5rem; margin-bottom: 20px; animation: floatEmoji 3s ease-in-out infinite alternate; }
        .popup-title {
            font-family: 'Dancing Script'; font-size: clamp(2rem, 6vw, 3.8rem);
            color: #d62828; line-height: 1.2; margin-bottom: 16px;
        }
        .popup-sub { font-size: 1rem; color: #888; margin-bottom: 36px; font-family: 'Special Elite', serif; }
        .popup-card .custom-btn { font-size: 1rem; }
    </style>
</head>

    <script>
        // ── SUPABASE ─────────────────────────────────────────────────
        const SUPABASE_URL = 'https://hstxthniajjvatbqwpsx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzdHh0aG5pYWpqdmF0YnF3cHN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMzYyODEsImV4cCI6MjA5MTkxMjI4MX0.tF8hfuXDYpp8vSjlTDoEFXv8DfFQeIhlbxhrh5ufvpo';

        async function sbFetch(path, opts = {}) {
            const res = await fetch(SUPABASE_URL + path, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', ...opts.headers },
                ...opts
            });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }
        function getPublicUrl(bucket, path) {
            return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}`;
        }

        // ── DATOS ────────────────────────────────────────────────────
        let cartasData = [];
        let totalUsuarios = 0;

        async function cargarCartas() {
            try {
                const usuarios = await sbFetch('/rest/v1/usuarios?select=*&order=id.asc');
                totalUsuarios = usuarios.length;
                const cartas = await sbFetch('/rest/v1/cartas?select=*');
                const cartaMap = {};
                cartas.forEach(c => { cartaMap[c.usuario_id] = c; });
                cartasData = usuarios.map(u => {
                    const carta = cartaMap[u.id];
                    return {
                        nombre: u.nombre,
                        texto: carta ? carta.mensaje : null,
                        foto1: carta && carta.foto1_path ? getPublicUrl('fotos', carta.foto1_path) : null,
                        foto2: carta && carta.foto2_path ? getPublicUrl('fotos', carta.foto2_path) : null,
                        enviada: !!carta
                    };
                });
                construirGrid();
            } catch(e) { console.error('Error cargando cartas:', e); }
        }

        function construirGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const total = Math.max(28, totalUsuarios);
            for (let i = 0; i < total; i++) {
                const env = document.createElement('div');
                env.className = 'envelope';
                if (cartasData[i] && !cartasData[i].enviada) env.classList.add('pendiente');
                env.innerHTML = `<div class="carta-interior"></div><div class="env-body"><div class="env-number">${i + 1}</div></div>`;
                env.onclick = () => openLetter(i);
                grid.appendChild(env);
            }
        }

        // ── VIDEO INTRO ──────────────────────────────────────────────
        const videoIntroScreen = document.getElementById('video-intro-screen');
        const videoIntro = document.getElementById('video-intro');

        function showVideoIntro() {
            videoIntroScreen.style.display = 'flex';
            requestAnimationFrame(() => {
                requestAnimationFrame(() => { videoIntroScreen.classList.add('visible'); });
            });
            videoIntro.volume = parseFloat(document.getElementById('video-volume').value);
            videoIntro.currentTime = 0;
            videoIntro.play().catch(() => {});
            updateVcUI(true);
        }

        function verVideoDeNuevo() {
            // Ocultar landing, mostrar video
            const landing = document.getElementById('landing');
            landing.style.opacity = '0';
            landing.style.visibility = 'hidden';
            showVideoIntro();
        }

        function revealLanding() {
            // Marcar que el video ya se vio en esta sesión
            sessionStorage.setItem('videoVisto', '1');
            const landing = document.getElementById('landing');
            landing.style.transition = 'opacity 0.8s ease, visibility 0.8s';
            landing.style.visibility = 'visible';
            landing.style.opacity = '1';
            // Mostrar botón "ver video" para que lo puedan repetir
            document.getElementById('btn-ver-video').style.display = 'block';
        }

        function toggleVideoIntro() {
            if (videoIntro.paused) { videoIntro.play(); updateVcUI(true); }
            else { videoIntro.pause(); updateVcUI(false); }
        }

        function updateVcUI(playing) {
            document.getElementById('vc-play-icon').style.display = playing ? 'none' : 'block';
            document.getElementById('vc-pause-icon').style.display = playing ? 'block' : 'none';
        }

        videoIntro.addEventListener('timeupdate', () => {
            if (!videoIntro.duration) return;
            const pct = (videoIntro.currentTime / videoIntro.duration) * 100;
            document.getElementById('video-progress').value = pct;
            document.getElementById('video-time').textContent =
                fmt(videoIntro.currentTime) + ' / ' + fmt(videoIntro.duration);
        });

        document.getElementById('video-progress').addEventListener('input', function() {
            videoIntro.currentTime = (this.value / 100) * videoIntro.duration;
        });

        document.getElementById('video-volume').addEventListener('input', function() {
            videoIntro.volume = parseFloat(this.value);
        });

        function fmt(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60).toString().padStart(2, '0');
            return `${m}:${sec}`;
        }

        // Cuando el video intro termina → fade out → revelar landing
        videoIntro.addEventListener('ended', () => {
            updateVcUI(false);
            videoIntroScreen.classList.add('fade-out');
            setTimeout(() => {
                videoIntroScreen.style.display = 'none';
                videoIntroScreen.classList.remove('visible', 'fade-out');
                revealLanding();
            }, 1000);
        });

        // ── PLAYLIST ─────────────────────────────────────────────────
        const playlist = [
            { src: "music/cancion1.mp3", titulo: "Aprender a Quererte" },
            { src: "music/cancion2.mp3", titulo: "Corazón" },
            { src: "music/cancion3.mp3", titulo: "Mi Nuevo Vicio" },
            { src: "music/cancion4.mp3", titulo: "Una Canción de Amor para Isa" },
            { src: "music/cancion5.mp3", titulo: "Turning Page" },
            { src: "music/cancion6.mp3", titulo: "Learn to Love Again" },
            { src: "music/cancion7.mp3", titulo: "Yellow" },
        ];

        const audio = document.getElementById('bg-music');
        const vinyl = document.getElementById('vinyl');
        let currentTrack = 0;
        let readSet = new Set();

        function loadTrack(index) {
            currentTrack = (index + playlist.length) % playlist.length;
            audio.src = playlist[currentTrack].src;
            document.getElementById('track-name').textContent = playlist[currentTrack].titulo;
        }
        function prevTrack() { loadTrack(currentTrack - 1); audio.play(); ui(true); }
        function nextTrack() { loadTrack(currentTrack + 1); audio.play(); ui(true); }
        audio.addEventListener('ended', () => nextTrack());

        function togglePlay() {
            if (audio.paused) { audio.play(); ui(true); }
            else { audio.pause(); ui(false); }
        }
        function ui(playing) {
            document.getElementById('play-icon').style.display = playing ? 'none' : 'block';
            document.getElementById('pause-icon').style.display = playing ? 'block' : 'none';
            vinyl.style.animationPlayState = playing ? 'running' : 'paused';
        }

        // ── INICIO (botón ABRIR) ─────────────────────────────────────
        async function start() {
            const landing = document.getElementById('landing');
            // Limpiar estilos inline para que la clase .hidden tenga efecto
            landing.style.opacity = '';
            landing.style.visibility = '';
            landing.style.transition = '';
            landing.classList.add('hidden');
            document.getElementById('main-content').style.display = 'flex';
            document.getElementById('header-nav').style.display = 'flex';
            document.getElementById('player').style.display = 'flex';
            loadTrack(0);
            togglePlay();
            createFlowers();
            await cargarCartas();
        }

        // ── LETRAS RECORTADAS ────────────────────────────────────────
        function buildLetters(text, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            text.split(' ').forEach((word, wi, arr) => {
                const wordDiv = document.createElement('div');
                wordDiv.style.cssText = 'display:flex;flex-shrink:0;';
                word.split('').forEach(char => {
                    const s = document.createElement('span');
                    s.className = `char v${Math.floor(Math.random() * 5) + 1}`;
                    s.innerText = char;
                    s.style.setProperty('--r', `${Math.random() * 8 - 4}deg`);
                    wordDiv.appendChild(s);
                });
                container.appendChild(wordDiv);
                if (wi < arr.length - 1) {
                    const space = document.createElement('div');
                    space.style.cssText = 'width:16px;flex-shrink:0;';
                    container.appendChild(space);
                }
            });
        }
        buildLetters("de todos los que", 'line1');
        buildLetters("te queremos, Bel", 'line2');

        // ── ABRIR CARTA ──────────────────────────────────────────────
        function openLetter(i) {
            const data = cartasData[i] || { nombre: `Carta ${i + 1}`, texto: null, foto1: null, foto2: null, enviada: false };
            buildLetters(data.nombre, 'friend-name-container');
            document.getElementById('letter-text')[(!data.enviada || !data.texto) ? 'innerHTML' : 'innerText'] =
                (!data.enviada || !data.texto)
                    ? '<em style="color:#aaa;">Esta persona aún no ha enviado su carta 💌</em>'
                    : data.texto;

            const pCont = document.getElementById('photo-container');
            pCont.innerHTML = '';
            [data.foto1, data.foto2].forEach(url => {
                if (!url) return;
                const pol = document.createElement('div');
                pol.style.cssText = `transform:rotate(${Math.random()*6-3}deg);background:#fff;padding:12px 12px 44px;box-shadow:0 8px 24px rgba(0,0,0,0.18);flex-shrink:0;width:100%;`;
                pol.innerHTML = `<img src="${url}" style="width:100%;height:auto;display:block;" onerror="this.parentElement.style.display='none'">`;
                pCont.appendChild(pol);
            });

            document.getElementById('overlay').style.display = 'flex';
            document.querySelectorAll('.envelope')[i].style.filter = 'grayscale(1)';
            readSet.add(i);
        }

        // ── CERRAR MODAL + POPUP 28 CARTAS ───────────────────────────
        function closeModal() {
            document.getElementById('overlay').style.display = 'none';
            const totalEnviadas = cartasData.filter(c => c && c.enviada).length;
            if (readSet.size >= totalEnviadas && totalEnviadas === totalUsuarios && totalUsuarios > 0) {
                const popup = document.getElementById('popup-feliz');
                popup.style.display = 'flex';
            }
        }

        // ── FLORES ───────────────────────────────────────────────────
        function createFlowers() {
            const container = document.getElementById('flower-container');
            const icons = ['🌻', '🌸', '✨', '💖', '🌼', '🌺'];
            const positions = [
                {top:'5%',left:'3%'},{top:'12%',left:'18%'},{top:'8%',left:'35%'},
                {top:'15%',left:'55%'},{top:'6%',left:'72%'},{top:'18%',left:'88%'},
                {top:'30%',left:'8%'},{top:'35%',left:'25%'},{top:'28%',left:'45%'},
                {top:'32%',left:'65%'},{top:'25%',left:'82%'},{top:'45%',left:'5%'},
                {top:'50%',left:'30%'},{top:'42%',left:'50%'},{top:'48%',left:'70%'},
                {top:'55%',left:'88%'},{top:'62%',left:'12%'},{top:'65%',left:'40%'},
                {top:'70%',left:'60%'},{top:'60%',left:'78%'},
            ];
            positions.forEach((pos, i) => {
                const f = document.createElement('div');
                f.className = 'flower-bg';
                f.innerText = icons[i % icons.length];
                f.style.top = pos.top; f.style.left = pos.left;
                f.style.fontSize = `${1.5 + Math.random() * 1.5}rem`;
                f.style.animationDelay = `${Math.random() * 6}s`;
                f.style.animationDuration = `${7 + Math.random() * 5}s`;
                container.appendChild(f);
            });
        }

        document.getElementById('volume').oninput = e => audio.volume = e.target.value;

        // Volumen inicial al 25%
        audio.volume = 0.25;

        // ── TRACKLIST ────────────────────────────────────────────────
        function buildTracklist() {
            const container = document.getElementById('tracklist');
            container.innerHTML = '';
            playlist.forEach((track, i) => {
                const item = document.createElement('div');
                item.className = 'track-item' + (i === currentTrack ? ' active' : '');
                item.innerHTML = `<span style="opacity:0.5;margin-right:8px;">${i + 1}.</span>${track.titulo}`;
                item.onclick = (e) => {
                    e.stopPropagation();
                    loadTrack(i);
                    audio.play(); ui(true);
                    toggleTracklist();
                };
                container.appendChild(item);
            });
        }

        function toggleTracklist() {
            buildTracklist(); // Actualiza el active cada vez
            document.getElementById('tracklist').classList.toggle('open');
        }

        // Cerrar tracklist al clicar fuera
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.vinyl-wrapper')) {
                document.getElementById('tracklist').classList.remove('open');
            }
        });

        // ── LOADER → VIDEO INTRO (o directo a landing si ya lo vio) ───
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
                setTimeout(() => {
                    if (sessionStorage.getItem('videoVisto')) {
                        // Ya vio el video antes en esta sesión → ir directo a landing
                        revealLanding();
                    } else {
                        showVideoIntro();
                    }
                }, 1200);
            }, 1800);
        });
    </script>
</body>
</html>
